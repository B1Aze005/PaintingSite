<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Paint</title>
        <link rel="stylesheet" href="paint.css"></link>
        <script src="slides.js" defer></script>
    </head>


    <body>
        <div id="toolbar">
            <input type="color" id="color-picker" value="#000000"></input>
            <input type="range" id="brush-size" min="1" max="50" value="10"></input>
            <button id="clear-button">Clear</button>
            <button id="fill-button">Fill</button>
            <button id="download-button">Download</button>
        </div>
        
        <div id="shapesBar">
            <button id="addSlide">Make Slide</button>
            <button id="square">Add Square</button>
            <button id="triangle">Add Triangle</button>
            <button id="circle">Add Circle</button>
        </div>

        <canvas id="board" width="640" height="480"></canvas>
        <p>Semi Saved Projects</p>
    
        <div id="slides">
            
        </div>
        <script src="paint.js"></script>
    </body>
</html>
